<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bank Autofill Settings</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; margin-top: 8px; color: #555; }
  input[type=text], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; background: #eee; }
  .primary { background: #1a73e8; color: #fff; }
  .danger { background: #fde8e8; color: #b00020; float: right; }
  .note { font-size: 13px; color: #666; }
  #status { color: green; margin-left: 10px; }
  #hotkey { font-weight: 600; text-align: center; cursor: pointer; background: #f6f9ff; }
  #hotkey.rec { background: #fff7d6; border-color: #e0a800; }
  .row { display: flex; gap: 8px; align-items: center; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: #222; }
  #hkmsg { color: #b00020; font-size: 13px; min-height: 16px; margin-top: 6px; }
</style>
</head>
<body>
  <h2>Bank Autofill</h2>
  <p class="note">Saved only in this browser. On a page with the bank form, click the ⚡ bubble or use your hotkey.</p>

  <div class="card">
    <strong>Shortcut &amp; bubble</strong>
    <label>Hotkey (click the box, then press your combination)</label>
    <div class="row">
      <input type="text" id="hotkey" readonly>
      <button id="resetKey">Reset</button>
    </div>
    <div id="hkmsg"></div>
    <label class="check"><input type="checkbox" id="showBubble"> Show floating ⚡ bubble on the form page</label>
    <button id="resetPos" style="margin-top:10px">Reset bubble position</button>
  </div>

  <div id="list"></div>
  <button id="add">+ Add profile</button>
  <button id="save" class="primary">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
